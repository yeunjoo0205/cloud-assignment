<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API 연동 실습 | Amy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
</head>
<body>
<div class="wrap">
  <nav class="topnav">
    <a class="brand" href="index.html">Amy</a>
    <a class="go" href="index.html">자기소개 페이지로 이동</a>
  </nav>

  <header>
    <span class="ticker">Vercel ↔ Render</span>
    <h1>API 연동 실습</h1>
    <p class="sub">이 화면(Vercel)이 FastAPI 백엔드(Render)를 <code>fetch</code>로 호출해 메모를 주고받습니다.</p>
  </header>

  <h2>백엔드 연결 상태</h2>
  <span class="status"><span class="dot" id="dot"></span><span id="statusText">확인 중…</span></span>
  <p class="msg">API 주소: <code id="apiUrl"></code> · <a id="docsLink" target="_blank" rel="noopener">Swagger UI 열기</a></p>

  <h2>메모</h2>
  <div class="row">
    <input id="text" placeholder="메모를 입력하세요" maxlength="200" aria-label="메모 내용">
    <button class="primary" id="addBtn">메모 추가</button>
  </div>
  <p class="msg" id="msg"></p>
  <ul class="memos" id="list"></ul>

  <p class="note">무료 Render 서버는 한동안 요청이 없으면 잠들어, 첫 호출에 30~60초가 걸릴 수 있습니다. 메모는 서버 메모리에 저장되므로 서버가 재시작되면 초기화됩니다.</p>
</div>
<script>
const API_URL = (window.API_URL || "http://localhost:8000").replace(/\/$/, "");
const $ = id => document.getElementById(id);
$("apiUrl").textContent = API_URL;
$("docsLink").href = API_URL + "/docs";

function setStatus(state, text){ $("dot").className = "dot " + state; $("statusText").textContent = text; }
function say(text, isErr){ $("msg").textContent = text; $("msg").className = "msg" + (isErr ? " err" : ""); }

async function checkHealth(){
  setStatus("", "서버에 연결하는 중… (첫 연결은 최대 1분)");
  try {
    const res = await fetch(API_URL + "/");
    const data = await res.json();
    setStatus("ok", "연결됨 — " + data.message);
  } catch (e) {
    setStatus("err", "연결 실패 — config.js의 API 주소와 Render 상태를 확인하세요");
  }
}

async function loadMemos(){
  try {
    const res = await fetch(API_URL + "/memos");            // GET
    const memos = await res.json();
    $("list").innerHTML = "";
    if (!memos.length) { $("list").innerHTML = '<li>아직 메모가 없습니다. 위에서 첫 메모를 추가해 보세요.</li>'; return; }
    memos.forEach(m => {
      const li = document.createElement("li");
      const span = document.createElement("span");
      span.innerHTML = '<span class="id">#' + m.id + '</span>';
      span.appendChild(document.createTextNode(m.content));
      const del = document.createElement("button");
      del.className = "del"; del.textContent = "삭제";
      del.onclick = () => deleteMemo(m.id);
      li.append(span, del);
      $("list").appendChild(li);
    });
  } catch (e) { say("메모 목록을 불러오지 못했습니다. 서버 연결을 확인하세요.", true); }
}

async function addMemo(){
  const content = $("text").value.trim();
  if (!content) return say("메모 내용을 입력하세요.", true);
  $("addBtn").disabled = true;
  try {
    const res = await fetch(API_URL + "/memos", {           // POST
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content })
    });
    const m = await res.json();
    $("text").value = ""; say("메모 #" + m.id + "을(를) 추가했습니다.");
    loadMemos();
  } catch (e) { say("메모를 추가하지 못했습니다.", true); }
  $("addBtn").disabled = false;
}

async function deleteMemo(id){
  try {
    await fetch(API_URL + "/memos/" + id, { method: "DELETE" });  // DELETE
    say("메모 #" + id + "을(를) 삭제했습니다.");
    loadMemos();
  } catch (e) { say("메모를 삭제하지 못했습니다.", true); }
}

$("addBtn").onclick = addMemo;
$("text").addEventListener("keydown", e => { if (e.key === "Enter") addMemo(); });
checkHealth().then(loadMemos);
</script>
</body>
</html>
